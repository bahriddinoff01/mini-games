# Builds the site and publishes it to GitHub Pages on every push to Main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public values: the publishable key is meant to be used in the browser.
          # The database is protected by Row Level Security, not by hiding this key.
          VITE_SUPABASE_URL: https://dwmrgvvebunvelsbnsgx.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_UA6pX_F7KuETmVjLV22xhQ_3EAT895y
      # GitHub Pages shows 404.html for unknown paths. Making it a copy of the app
      # lets links like /mini-games/memory work when opened or refreshed directly.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
